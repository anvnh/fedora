set -g mouse on
set -g @continuum-restore 'on'
set-option -g status-position top
set-option -g renumber-windows on

set -g default-terminal "tmux-256color"

set -g xterm-keys on
set -s extended-keys always
set -g focus-events on

set -g terminal-features[0] "xterm*:RGB"
set -g terminal-features[1] "xterm*:extkeys"
set -g terminal-features[2] "xterm*:clipboard"
set -g terminal-features[3] "xterm*:ccolour"
set -g terminal-features[4] "xterm*:cstyle"
set -g terminal-features[5] "xterm*:focus"
set -g terminal-features[6] "xterm*:title"
set -g terminal-features[7] "tmux*:RGB"
set -g terminal-features[8] "tmux*:extkeys"

set -g terminal-overrides[0] "xterm*:Tc"
set -g terminal-overrides[1] "tmux*:Tc"

unbind C-b

set -g prefix C-a
bind C-a send-prefix

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Switch panes with Prefix + hjkl (Ctrl-a + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Restore clear screen with Prefix + Ctrl-l (since Ctrl-l is used for pane navigation)
bind C-l send-keys 'C-l'

set -gq allow-passthrough on
set -g visual-activity off

# bind -n C-M-h previous-window
# bind -n C-M-l next-window
bind -n M-h previous-window
bind -n M-l next-window

# Vi mode for copy mode
set -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -g status-style fg=white,bg=colour234

# active window
# set-window-option -g window-status-current-style fg=colour231,bg=default
set-window-option -g window-status-current-style fg=colour46,bg=default

# inactive windows
set-window-option -g window-status-style fg=colour244,bg=default